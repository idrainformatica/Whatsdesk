server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /privacy/ {
        try_files /privacy/index.html =404;
    }

    location / {
        return 404;
    }
}
